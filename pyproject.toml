[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bumbo_stats"
version = "0.5.11"
description = "拓竹3D打印机多机监控面板"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    # 核心（监控面板 + 云端状态）：无重型依赖，pip install . 即可跑
    "fastapi>=0.141",  # 0.141+ 才兼容 Starlette 1.x；旧版会把 starlette<0.36 装回去破坏共享环境
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.6",
    "aiosqlite>=0.19",
    "bambu-lab-cloud-api>=1.0.4",  # MQTTClient,核心状态推送必需
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# 企微/飞书通知(含群指令与监控截图);截图也可单独装 [screenshot]
notify = [
    "websockets>=12.0",
    "aiohttp>=3.9",
    "wecom-aibot-sdk>=0.1.3",
    "lark-oapi>=1.2",
    "playwright>=1.40",
]
# 仅监控截图(通知文字不需要 SDK 时)
screenshot = [
    "playwright>=1.40",
]
# AI 缺陷检测:推理需要 torch/onnxruntime,由检测器目录自行管理依赖
# (见 bambu_ai_deploy_* 各自 requirements);此处仅声明特征库读取需要 numpy
ai = [
    "numpy>=1.24",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.26",
    "ruff>=0.1",
]

[project.scripts]
bumbo-stats = "bumbo_stats.main:main"

[tool.setuptools]
# 显式列出子包，避免 flat-layout 自动发现报错；include-package-data
# 默认开启，配合下方 package-data 把 templates/static 打进 wheel。
packages = ["bumbo_stats", "bumbo_stats.api", "bumbo_stats.printer"]

[tool.setuptools.package-data]
# Web 面板的 Jinja2 模板与静态资源必须随包分发，否则 pip install 后 500
bumbo_stats = [
    "templates/*.html",
    "static/css/*.css",
    "static/js/*.js",
    "static/img/*.svg",
    "static/img/*.png",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
