<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bumbo Stats{% endblock %}</title>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg4sYj7Auy6VnxdL2Eer9a2Y54b0mV" crossorigin="anonymous"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="/static/css/dashboard.css">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">🖨️ Bumbo Stats</div>
        <div class="nav-status">
            <span id="ws-status" class="ws-dot ws-disconnected"></span>
            <span id="ws-text">未连接</span>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link">📊 监控</a>
            <a href="/settings" class="nav-link">⚙️ 设置</a>
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
