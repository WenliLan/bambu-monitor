<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bambu Monitor{% endblock %}</title>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <!-- 自定义样式（asset_ver 由后端按版本号注入，升级后强制刷新缓存 P2-21） -->
    <link rel="stylesheet" href="/static/css/dashboard.css?v={{ asset_ver }}">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">🖨️ Bambu Monitor</div>
        <div class="nav-status">
            <span id="ws-status" class="ws-dot ws-disconnected"></span>
            <span id="ws-text">未连接</span>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link">📊 监控</a>
            <a href="/settings" class="nav-link">⚙️ 设置</a>
        </div>
    </nav>
    <main class="container">
        <div id="ai-alarm-container"></div>
        {% block content %}{% endblock %}
    </main>
    <!-- 连接中遮罩：默认隐藏，dashboard.js 在 WebSocket 未连接成功时给 <body>
         加 .ws-connecting 类后显示。中央放置大提示框 + 虚化主内容，突出“暂未
         连接成功”，避免用户误以为数据已同步。导航栏 z-index 更高，仍可点击。 -->
    <div class="connect-overlay" id="connect-overlay" role="alert" aria-live="assertive">
        <div class="connect-dialog">
            <div class="connect-spinner" aria-hidden="true"></div>
            <h2 class="connect-title">正在连接中…</h2>
            <p class="connect-desc">数据尚未同步成功，下方内容可能不是最新状态。</p>
            <p class="connect-hint">若长时间未连接，请检查网络或后端服务是否已启动。</p>
        </div>
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
